name: Optimize Gregory Package
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-package.yml'
      - 'Gregory-Electric-GitHub-Vercel-FINAL.zip'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install optimizer dependencies
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Build validated package
        shell: bash
        run: |
          cat > /tmp/optimize.py <<'PY'
          import base64, hashlib, io, json, os, re, shutil, sys, zipfile
          from pathlib import Path
          import requests
          from PIL import Image

          ROOT=Path.cwd()
          SRC=ROOT/'Gregory-Electric-GitHub-Vercel-FINAL.zip'
          WORK=ROOT/'_package_work'
          OUT=ROOT/'Gregory-Electric-Optimized-Package.zip'
          if not SRC.exists(): raise SystemExit('source ZIP missing')
          shutil.rmtree(WORK, ignore_errors=True); WORK.mkdir()
          raw=WORK/'raw'; pkg=WORK/'Gregory-Electric-Optimized-Package'; raw.mkdir(); pkg.mkdir()
          with zipfile.ZipFile(SRC) as z: z.extractall(raw)
          # locate review shell
          htmls=list(raw.rglob('index.html'))
          if not htmls: raise SystemExit('index.html missing from source')
          shell=max(htmls,key=lambda p:p.stat().st_size)
          text=shell.read_text('utf-8',errors='strict')
          # extract the exact three embedded theme payloads
          m=re.search(r'const\s+P\s*=\s*(\{.*?\})\s*;\s*(?:const|let|var)',text,re.S)
          if not m:
              m=re.search(r'const\s+P\s*=\s*(\{.*?\})\s*;',text,re.S)
          if not m: raise SystemExit('embedded theme payload object P not found')
          P=json.loads(m.group(1))
          if set(P) < {'1','2','3'}: raise SystemExit('expected three themes')
          themes={k:base64.b64decode(P[k]).decode('utf-8') for k in ('1','2','3')}
          names={'1':'theme-01-refined-current','2':'theme-02-live-current','3':'theme-03-power-systems'}
          session=requests.Session(); session.headers['User-Agent']='Mozilla/5.0 (Gregory Electric package optimizer)'

          def clean_url(u): return u.replace('&amp;','&')
          def safe_name(seed, ext): return hashlib.sha256(seed.encode()).hexdigest()[:16]+ext
          def optimize_bytes(data, target, hero=False, transparent_hint=False):
              im=Image.open(io.BytesIO(data)); im.load()
              maxdim=2400 if hero else 2000
              w,h=im.size
              scale=min(1,maxdim/max(w,h))
              if scale<1: im=im.resize((round(w*scale),round(h*scale)),Image.Resampling.LANCZOS)
              has_alpha=('A' in im.getbands()) or ('transparency' in im.info)
              target.parent.mkdir(parents=True,exist_ok=True)
              if has_alpha or transparent_hint:
                  if im.mode not in ('RGBA','LA'): im=im.convert('RGBA')
                  im.save(target,'WEBP',lossless=True,method=6)
              else:
                  if im.mode!='RGB': im=im.convert('RGB')
                  im.save(target,'WEBP',quality=78,method=6,optimize=True)
              return target

          def localize_fonts(html, tdir):
              pattern=re.compile(r"@import\s+url\((['\"]?)(https://fonts\.googleapis\.com/[^)'\"]+)\1\)\s*;?")
              for mm in list(pattern.finditer(html)):
                  url=clean_url(mm.group(2)); r=session.get(url,timeout=30); r.raise_for_status(); css=r.text
                  fdir=tdir/'assets'/'fonts'; fdir.mkdir(parents=True,exist_ok=True)
                  for fu in sorted(set(re.findall(r'url\((https://fonts\.gstatic\.com/[^)]+)\)',css))):
                      rr=session.get(fu,timeout=30); rr.raise_for_status(); ext=Path(fu.split('?')[0]).suffix or '.woff2'; fn=safe_name(fu,ext)
                      (fdir/fn).write_bytes(rr.content); css=css.replace(fu,'assets/fonts/'+fn)
                  html=html.replace(mm.group(0),css)
              return html

          def localize_images(html, tdir):
              assets=tdir/'assets'; assets.mkdir(exist_ok=True)
              css_urls=set(re.findall(r'url\((?:[\'\"]?)(https?://[^)\'\"]+)',html))
              src_urls=set(re.findall(r'(?:src|poster)=[\'\"](https?://[^\'\"]+)',html))
              urls=sorted(css_urls|src_urls)
              cache={}
              for u0 in urls:
                  u=clean_url(u0)
                  if 'fonts.googleapis.com' in u or 'fonts.gstatic.com' in u: continue
                  hero=u0 in css_urls
                  try:
                      r=session.get(u,timeout=45); r.raise_for_status(); data=r.content; ct=r.headers.get('content-type','').lower()
                      if 'svg' in ct or u.lower().split('?')[0].endswith('.svg'):
                          fn=safe_name(u,'.svg'); (assets/fn).write_bytes(data); rel='assets/'+fn
                      else:
                          fn=safe_name(u,'.webp'); optimize_bytes(data,assets/fn,hero=hero); rel='assets/'+fn
                  except Exception as e:
                      raise RuntimeError(f'Unable to localize required asset {u}: {e}')
                  html=html.replace(u0,rel).replace(u,rel)
              return html

          # write the three separate websites, changing only asset references/font delivery
          original_hashes={}
          for k,h in themes.items():
              tdir=pkg/'websites'/names[k]; tdir.mkdir(parents=True)
              original_hashes[k]=hashlib.sha256(h.encode()).hexdigest()
              h2=localize_fonts(h,tdir)
              h2=localize_images(h2,tdir)
              (tdir/'index.html').write_text(h2,'utf-8')

          # brand boards: preserve all six as separate images and sequentially rename
          src_boards=sorted(list(raw.rglob('design-*.png'))+list(raw.rglob('design-*.jpg'))+list(raw.rglob('design-*.jpeg')))
          if len(src_boards)!=6: raise SystemExit(f'expected 6 brand boards, found {len(src_boards)}')
          bdir=pkg/'brand-boards'; bdir.mkdir()
          for i,p in enumerate(src_boards,1):
              with Image.open(p) as im:
                  im.load(); w,h=im.size; target_w=1600 if w<1600 else min(w,2000); scale=target_w/w
                  if scale!=1: im=im.resize((target_w,round(h*scale)),Image.Resampling.LANCZOS)
                  if im.mode not in ('RGB','RGBA'): im=im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
                  out=bdir/f'brand-board-{i:02d}.webp'
                  if 'A' in im.getbands(): im.save(out,'WEBP',lossless=True,method=6)
                  else: im.save(out,'WEBP',quality=84,method=6,optimize=True)

          # client review shell: local iframe navigation only; website layouts remain in their own exact theme docs
          shell_out='''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gregory Electric — Client Review</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090a0b;font-family:Inter,system-ui,sans-serif}#frame{width:100%;height:100%;border:0;background:white}.tab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:20;width:46px;min-height:154px;border:1px solid #ffffff24;border-right:0;border-radius:12px 0 0 12px;background:#111315f7;color:#fff;cursor:pointer}.tab span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.panel{position:fixed;z-index:19;right:-310px;top:0;width:min(310px,84vw);height:100%;background:#111315;color:#fff;border-left:1px solid #ffffff24;transition:.25s;display:flex;flex-direction:column}.open .panel{right:0}.open .tab{right:min(310px,84vw)}.head{padding:24px 20px 18px;border-bottom:1px solid #ffffff24}.head small{color:#9ea5aa;text-transform:uppercase;letter-spacing:.16em;font-size:9px}.head h2{margin:8px 0 6px}.head p{margin:0;color:#9ea5aa;font-size:10px;line-height:1.5}.list{padding:13px;display:grid;gap:9px}.dir{border:1px solid #ffffff24;background:#171a1c;color:#fff;padding:14px;text-align:left;cursor:pointer}.dir.on{border-color:#d9a62e99;background:#202326}.dir b{display:block}.dir small{display:block;color:#8f979d;margin-top:4px}.gallery{position:fixed;inset:0;z-index:8;background:#ece9e2;display:none;overflow:auto;padding:24px}.gallery.on{display:block}.boards{max-width:1300px;margin:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.boards img{width:100%;height:auto;display:block;background:white}.gallery h1{max-width:1300px;margin:0 auto 20px}.foot{margin-top:auto;padding:16px 18px;border-top:1px solid #ffffff24;color:#8f979d;font-size:9px}@media(max-width:680px){.boards{grid-template-columns:1fr}.gallery{padding:14px}}</style></head><body><div id="shell"><iframe id="frame" src="websites/theme-01-refined-current/index.html" title="Gregory Electric design preview"></iframe><section id="gallery" class="gallery"><h1>Logo Designs</h1><div class="boards">BOARD_IMAGES</div></section><button id="tab" class="tab"><span>Design Switcher</span></button><aside class="panel"><div class="head"><small>Client Review</small><h2>Explore the directions</h2><p>Three website experiences plus six individual brand boards.</p></div><div class="list"><button class="dir on" data-src="websites/theme-01-refined-current/index.html">01 · Refined Current<small>Editorial precision</small></button><button class="dir" data-src="websites/theme-02-live-current/index.html">02 · Live Current<small>High-energy contractor</small></button><button class="dir" data-src="websites/theme-03-power-systems/index.html">03 · Power Systems<small>Engineered electrical system</small></button><button class="dir" data-gallery="1">04 · Logo Designs<small>Six identity boards</small></button></div><div class="foot">All website and board assets are packaged locally.</div></aside></div><script>const s=document.getElementById('shell'),f=document.getElementById('frame'),g=document.getElementById('gallery'),bs=[...document.querySelectorAll('.dir')];tab.onclick=()=>s.classList.toggle('open');bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>x.classList.remove('on'));b.classList.add('on');if(b.dataset.gallery){g.classList.add('on');f.style.visibility='hidden'}else{g.classList.remove('on');f.style.visibility='visible';f.src=b.dataset.src}s.classList.remove('open')});</script></body></html>'''
          imgs=''.join(f'<img src="brand-boards/brand-board-{i:02d}.webp" alt="Gregory Electric brand board {i:02d}">' for i in range(1,7))
          (pkg/'index.html').write_text(shell_out.replace('BOARD_IMAGES',imgs),'utf-8')

          # validation
          failures=[]
          files=[p for p in pkg.rglob('*') if p.is_file()]
          websites=list((pkg/'websites').glob('*/index.html'))
          boards=list((pkg/'brand-boards').glob('brand-board-*.webp'))
          if len(websites)!=3: failures.append(f'website count {len(websites)} != 3')
          if len(boards)!=6: failures.append(f'board count {len(boards)} != 6')
          if len(files)>500: failures.append(f'file count {len(files)} > 500')
          largest=max((p.stat().st_size for p in files),default=0)
          if largest>=20*1024*1024: failures.append('individual file >= 20MB')
          expanded=sum(p.stat().st_size for p in files)
          if expanded>=70*1024*1024: failures.append('expanded package >= 70MB')
          hashes=[hashlib.sha256(p.read_bytes()).hexdigest() for p in websites]
          if len(set(hashes))!=3: failures.append('website themes are not distinct')
          # verify local image/font references and no remote asset URLs
          for hp in [pkg/'index.html']+websites:
              h=hp.read_text('utf-8')
              if re.search(r'url\([\'\"]?https?://',h): failures.append(f'remote CSS asset in {hp.relative_to(pkg)}')
              for attr,url in re.findall(r'(src|poster)=[\'\"]([^\'\"]+)',h):
                  if url.startswith(('data:','http://','https://')): failures.append(f'non-relative {attr} in {hp.relative_to(pkg)}: {url[:80]}'); continue
                  target=(hp.parent/url.split('#')[0].split('?')[0]).resolve()
                  if not target.exists(): failures.append(f'missing reference {url} in {hp.relative_to(pkg)}')
          for bp in boards:
              try:
                  with Image.open(bp) as im: im.verify()
              except Exception as e: failures.append(f'bad board {bp.name}: {e}')
          report=[]
          report.append('Gregory Electric Optimized Package Validation')
          report.append(f'Websites: {len(websites)}')
          report.append(f'Brand boards: {len(boards)}')
          report.append(f'Files: {len(files)}')
          report.append(f'Expanded bytes: {expanded}')
          report.append(f'Largest file bytes: {largest}')
          if failures:
              report.append('STATUS: FAIL'); report.extend('FAIL: '+x for x in failures)
              (pkg/'validation-report.txt').write_text('\n'.join(report)+'\n','utf-8')
              raise SystemExit('\n'.join(failures))
          (pkg/'validation-report.txt').write_text('\n'.join(report+['STATUS: PRE-ZIP PASS'])+'\n','utf-8')
          # rebuild file list after report and zip
          if OUT.exists(): OUT.unlink()
          with zipfile.ZipFile(OUT,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(pkg.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(pkg))
          csize=OUT.stat().st_size
          if csize>=35*1024*1024: raise SystemExit(f'compressed ZIP >=35MB: {csize}')
          # clean extraction test
          check=WORK/'clean-extract'; shutil.rmtree(check,ignore_errors=True); check.mkdir()
          with zipfile.ZipFile(OUT) as z:
              bad=z.testzip(); z.extractall(check)
          if bad: raise SystemExit('ZIP CRC failure: '+bad)
          for rel in ['index.html','websites/theme-01-refined-current/index.html','websites/theme-02-live-current/index.html','websites/theme-03-power-systems/index.html']:
              if not (check/rel).is_file(): raise SystemExit('clean extraction missing '+rel)
          print(json.dumps({'compressed_bytes':csize,'expanded_bytes':expanded,'websites':3,'brand_boards':6,'files':len([p for p in pkg.rglob('*') if p.is_file()]),'largest_file_bytes':largest,'status':'PASS'}))
          PY
          python /tmp/optimize.py | tee optimization-summary.json
      - name: Upload finished ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gregory-Electric-Optimized-Package
          path: Gregory-Electric-Optimized-Package.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload validation summary
        uses: actions/upload-artifact@v4
        with:
          name: Gregory-Electric-Optimization-Summary
          path: optimization-summary.json
          retention-days: 7
