  const liveTitle=/Live Current/i;
  let boundFrame=null;

  function isLiveCurrent(shellDoc,themeFrame){
    try{
      const frameLabel=themeFrame.getAttribute('title')||'';
      const shellHash=shellDoc.defaultView?.location?.hash||'';
      const selected=shellDoc.querySelector('[data-id="2"][aria-pressed="true"],[data-theme="2"][aria-pressed="true"],[data-key="2"][aria-selected="true"]');
      return liveTitle.test(frameLabel)||/direction-2|theme-2/i.test(shellHash)||!!selected;
    }catch(e){return false}
  }

  function applyPatch(){
    try{
      const shellDoc=review.contentDocument;
      if(!shellDoc) return;
      const themeFrame=shellDoc.getElementById('frame');
      if(!themeFrame) return;
      if(boundFrame!==themeFrame){
        boundFrame=themeFrame;
        themeFrame.addEventListener('load',()=>setTimeout(applyPatch,0));
      }
      if(!isLiveCurrent(shellDoc,themeFrame)) return;
      const doc=themeFrame.contentDocument;
      if(!doc||!doc.head) return;
      let style=doc.getElementById(PATCH_ID);
      if(!style){
        style=doc.createElement('style');
        style.id=PATCH_ID;
        doc.head.appendChild(style);
      }
      if(style.textContent!==MOBILE_CSS) style.textContent=MOBILE_CSS;
    }catch(e){console.warn('Gregory Electric Live Current mobile patch:',e)}
  }

  function bindReview(){
    try{
      const doc=review.contentDocument;
      if(!doc) return;
      const frame=doc.getElementById('frame');
      if(frame&&frame!==boundFrame){
        boundFrame=frame;
        frame.addEventListener('load',()=>setTimeout(applyPatch,0));
      }
      applyPatch();
    }catch(e){}
  }

  review.addEventListener('load',()=>{
    bindReview();
    setTimeout(bindReview,100);
    setTimeout(bindReview,350);
    setTimeout(bindReview,900);
  });
  review.src='/review-locked.html'+(location.hash||'');

  setInterval(()=>{
    try{
      bindReview();
      const h=review.contentWindow.location.hash;
      if(h&&h!==location.hash) history.replaceState(null,'',h);
    }catch(e){}
  },250);
})();
