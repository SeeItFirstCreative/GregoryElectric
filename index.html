<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gregory Electric — Client Review</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0c0d}
#review{display:block;width:100%;height:100%;border:0;background:#0b0c0d}
</style>
</head>
<body>
<iframe id="review" title="Gregory Electric Client Review"></iframe>
<script>
(()=>{
  const review=document.getElementById('review');
  const PATCH_ID='ge-live-current-mobile-format-v1';
  const MOBILE_CSS=`
@media (max-width:680px){
  html,body{max-width:100%!important;overflow-x:hidden!important}
  .wrap{width:calc(100% - 24px)!important}
  .topbar{height:64px!important}
  .mobile-drawer{top:64px!important}
  .topbar .wrap{gap:10px!important}
  .mark{width:38px!important;height:38px!important;flex:0 0 38px!important}
  .brand-copy b{font-size:13px!important}
  .brand-copy small{font-size:7px!important;letter-spacing:.08em!important}
  .hero{padding-top:64px!important;min-height:0!important;overflow:hidden!important}
  .hero:before{inset:64px 0 0!important}
  .hero-grid{min-height:0!important}
  .hero-left{min-height:560px!important;padding:40px 16px 30px!important}
  .hero h1{font-size:clamp(42px,12vw,50px)!important;line-height:.88!important;margin:18px 0 16px!important;max-width:100%!important}
  .hero h1 .hero-line{white-space:normal!important}
  .hero-copy{max-width:100%!important;font-size:13px!important;line-height:1.55!important}
  .hero-actions{display:grid!important;grid-template-columns:1fr!important;gap:9px!important;margin-top:20px!important}
  .hero-actions .btn{width:100%!important;min-width:0!important;justify-content:center!important}
  .hero-meta{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:11px 12px!important;margin-top:22px!important}
  .hero-meta div{min-width:0!important;padding-right:0!important}
  .hero-meta div:last-child{grid-column:1/-1!important}
  .power-line{right:10px!important}
  .hero-circuit{bottom:12px!important}
  .console,.system,.field,.process{padding:50px 0!important}
  .contact{padding-top:50px!important}
  .console-head,.system-head,.field-head,.process-head{margin-bottom:22px!important}
  .console h2,.system h2,.field h2,.proof h2,.process h2,.contact h2{font-size:clamp(34px,10.5vw,42px)!important;line-height:.96!important}
  .console-head p,.system-head p,.field-head p,.process-head p{margin-top:12px!important}
  .console-shell,.system-shell,.proof-shell,.contact-shell{grid-template-columns:1fr!important;max-width:100%!important}
  .console-options{grid-template-columns:1fr!important}
  .console-option{border-right:0!important}
  .console-output{padding:26px 16px!important;min-width:0!important}
  .system-map{min-height:400px!important;padding:14px!important;max-width:100%!important;overflow:hidden!important}
  .distribution{height:330px!important;max-width:100%!important}
  .system-step{grid-template-columns:42px minmax(0,1fr)!important;padding:17px 8px!important}
  .system-step h3{font-size:24px!important}
  .field-grid{display:grid!important;grid-template-columns:1fr!important;grid-template-rows:none!important;gap:12px!important;max-width:100%!important}
  .work-card,.work-card.tall,.work-card.wide{grid-column:auto!important;grid-row:auto!important;min-height:270px!important;max-width:100%!important}
  .work-card{clip-path:none!important;transform:none!important}
  .proof-board,.review-board{padding:46px 16px!important}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .metric{min-width:0!important;min-height:112px!important;padding:15px!important}
  .process-track{grid-template-columns:1fr!important;max-width:100%!important}
  .process-progress{display:none!important}
  .phase{min-height:0!important;padding:18px 0 18px 22px!important}
  .contact-meta,.form-grid{grid-template-columns:1fr!important}
  .request{padding:16px!important;max-width:100%!important}
  .job-tabs{grid-template-columns:1fr 1fr!important}
  textarea.field-in,.submit{grid-column:auto!important}
  .service-bus-inner{width:calc(100% - 24px)!important}
  .bus-circuits{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .bus-circuit{min-width:0!important}
  .footer{margin-top:44px!important;padding-bottom:76px!important}
  .footer .wrap{padding:20px 0!important}
  .hero,.service-bus,.console,.system,.field,.proof,.process,.contact,.footer,
  .console-shell,.system-shell,.field-grid,.proof-shell,.process-track,.contact-shell{max-width:100%!important;overflow-x:hidden!important}
}
@media (max-width:390px){
  .hero-left{padding-left:14px!important;padding-right:14px!important}
  .hero h1{font-size:42px!important}
  .hero-meta{grid-template-columns:1fr!important}
  .hero-meta div:last-child{grid-column:auto!important}
  .metrics{grid-template-columns:1fr!important}
  .job-tabs{grid-template-columns:1fr!important}
}
`;
  const liveTitle=/Live Current/i;
  let boundFrame=null;
  function applyPatch(){
    try{
      const shellDoc=review.contentDocument;
      if(!shellDoc) return;
      const themeFrame=shellDoc.getElementById('frame');
      if(!themeFrame) return;
      if(boundFrame!==themeFrame){
        boundFrame=themeFrame;
        themeFrame.addEventListener('load',()=>setTimeout(applyPatch,0));
      }
      const doc=themeFrame.contentDocument;
      if(!doc||!doc.head||!liveTitle.test(doc.title||'')) return;
      let style=doc.getElementById(PATCH_ID);
      if(!style){
        style=doc.createElement('style');
        style.id=PATCH_ID;
        style.textContent=MOBILE_CSS;
        doc.head.appendChild(style);
      }
    }catch(e){console.warn('Gregory Electric mobile format patch:',e)}
  }
  function bindReview(){
    try{
      const doc=review.contentDocument;
      if(!doc) return;
      const frame=doc.getElementById('frame');
      if(frame && frame!==boundFrame){
        boundFrame=frame;
        frame.addEventListener('load',()=>setTimeout(applyPatch,0));
      }
      applyPatch();
    }catch(e){}
  }
  review.addEventListener('load',()=>{bindReview();setTimeout(bindReview,120);setTimeout(bindReview,500)});
  review.src='/review-locked.html'+(location.hash||'');
  setInterval(()=>{
    try{
      bindReview();
      const h=review.contentWindow.location.hash;
      if(h && h!==location.hash) history.replaceState(null,'',h);
    }catch(e){}
  },600);
})();
</script>
</body>
</html>
